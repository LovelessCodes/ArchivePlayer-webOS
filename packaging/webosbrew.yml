# Template for webosbrew/apps-repo/packages/codes.loveless.archiveplayer.yml.
# Do not submit until playback works on hardware; the preview is installable by
# URL, but the central repository expects a complete application.
title: ArchivePlayer
iconUri: https://raw.githubusercontent.com/LovelessCodes/ArchivePlayer-webOS/main/pkg/icon.png
detailIconUri: https://raw.githubusercontent.com/LovelessCodes/ArchivePlayer-webOS/main/pkg/largeIcon.png
manifestUrl: https://github.com/LovelessCodes/ArchivePlayer-webOS/releases/latest/download/codes.loveless.archiveplayer.manifest.json
category: multimedia
pool: main
shortDescription: Native Archive.org library client for ArchivePlayer servers
requirements:
  webosRelease: '>=5.0'
description: |
  ArchivePlayer is an unofficial native client for a self-hosted ArchivePlayer
  server. It renders its interface directly with SDL2, without Chromium or a
  WebView, discovers the server over mDNS, pairs with an on-screen code, and
  browses the shared Archive.org library.

  This is a preview release. Library browsing, search, poster artwork, and
  progress are implemented; video playback through `com.webos.media` is the
  next hardware milestone.

  Source: https://github.com/LovelessCodes/ArchivePlayer-webOS

  ArchivePlayer is derived from the original ArchivePlayer by Jeppe Kjeldal:
  https://github.com/JeppeKjeldal/ArchivePlayer
