[workspace]
members = [
  "crates/api",
  "crates/app",
  "crates/gfx",
  "crates/platform",
  "crates/protocol",
  "crates/sim",
  "crates/ui",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LovelessCodes/ArchivePlayer-webOS"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = { version = "0.21", default-features = false }
thiserror = "2"
ureq = "2.12"
url = "2"
