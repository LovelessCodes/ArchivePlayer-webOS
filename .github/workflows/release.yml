name: webOS release

on:
  push:
    tags:
      - "webos-v*"

permissions:
  contents: write

env:
  NDK_VERSION: 2026.08-webos
  NDK_SHA256: 2230a6351e5cce6fcb9d4fdcb4697335f223995401ef969c81744aaeb14c5344

jobs:
  package:
    name: Build unsigned .ipk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabi
      - uses: swatinem/rust-cache@v2
        with:
          key: webos-arm
      - name: Cache the webOS NDK download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/webos-ndk.tar.gz
          key: webos-ndk-${{ env.NDK_VERSION }}
      - name: Install the webOS NDK
        run: |
          archive="$RUNNER_TEMP/webos-ndk.tar.gz"
          if [ ! -f "$archive" ]; then
            curl -fsSL --retry 3 \
              "https://github.com/openlgtv/buildroot-nc4/releases/download/$NDK_VERSION/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz" \
              -o "$archive"
          fi
          echo "$NDK_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/arm-webos-linux-gnueabi_sdk-buildroot/bin/arm-webos-linux-gnueabi-gcc"
          echo "WEBOS_NDK=$RUNNER_TEMP/arm-webos-linux-gnueabi_sdk-buildroot" >> "$GITHUB_ENV"
      - name: Build and package
        run: |
          tag="${GITHUB_REF_NAME#webos-v}"
          scripts/build-arm.sh
          python3 scripts/package.py \
            --strip "$WEBOS_NDK/bin/arm-webos-linux-gnueabi-strip" \
            --expect-version "$tag"
          (cd dist && sha256sum ./*.ipk > SHA256SUMS.txt)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#webos-v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/codes.loveless.archiveplayer_"$tag"_arm.ipk \
            dist/codes.loveless.archiveplayer_"$tag"_arm.ipk.sha256 \
            dist/codes.loveless.archiveplayer.manifest.json \
            dist/SHA256SUMS.txt \
            --title "ArchivePlayer for webOS $tag (preview)" \
            --notes-file docs/release-notes/webos-preview.md
